sentence=Static-allocation WireGuard for ESP32, drop-in compatible with WireGuard-ESP32-Arduino.
paragraph=Fork of ciniml/WireGuard-ESP32-Arduino with the wireguard_device struct moved to BSS and the handshake + transport pbufs routed through lwIP's PBUF_POOL instead of PBUF_RAM. Eliminates the per-cycle ~5 KB max_alloc residue we measured on ESP32-C3 with a heap-tight framework workload. Same public API — replace the lib_dep, no code changes in the consumer.
